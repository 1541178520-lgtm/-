name: Deploy student archive to GitHub Pages

# Keep the deployment workflow self-documenting and easy to retrigger.

on:
  push:
    branches:
      - main
      - codex/student-growth-archive
    paths:
      - '学生成长档案系统/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 学生成长档案系统
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 学生成长档案系统/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:pages
        env:
          VITE_STATIC_PAGES: 'true'
          VITE_API_ORIGIN: https://student-growth-archive.chuangxin-xueyuan.workers.dev
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 学生成长档案系统/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
